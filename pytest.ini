[pytest]
# pytest configuration following O3's recommendations
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers for different test types
markers =
    unit: Unit tests (no network, no external services)
    integration: Integration tests (mocked external services)
    e2e: End-to-end tests (real services, slow)
    slow: Tests that take significant time

# Test output settings
addopts = 
    -v
    --strict-markers
    --tb=short
    --capture=no

# Timeout for tests (seconds)
timeout = 30
timeout_method = thread

# Coverage settings
[coverage:run]
source = core
omit = 
    */tests/*
    */migrations/*
    */__pycache__/*