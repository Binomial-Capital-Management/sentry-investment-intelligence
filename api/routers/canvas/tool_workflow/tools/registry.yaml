    params_schema:
      symbol:
        type: string
        required: true
        enum: ["Gold (GCUSD)", "Silver (SIUSD)", "Platinum (PLUSD)", "Palladium (PAUSD)", "Copper (HGUSD)", "Crude Oil WTI (CLUSD)", "Brent Crude (BZUSD)", "Natural Gas (NGUSD)", "Heating Oil (HOUSD)", "RBOB Gasoline (RBUSD)", "Corn (ZCUSD)", "Soybeans (ZSUSD)", "Soybean Meal (ZMUSD)", "Soybean Oil (ZLUSD)", "Wheat (ZWUSD)", "Wheat CBOT (KEUSD)", "Oats (ZOUSD)", "Rough Rice (ZRUSD)", "Sugar (SBUSD)", "Cocoa (CCUSD)", "Coffee (KCUSD)", "Cotton (CTUSD)", "Live Cattle (LCUSD)", "Lean Hogs (LHUSD)", "Feeder Cattle (FCUSD)", "Class III Milk (DAUSD)", "Nonfat Dry Milk (DKUSD)", "Butter (GFUSD)", "Orange Juice (OJUSD)", "Lumber (LBUSD)"]
        description: Select commodity to analyze
      years_history: {type: number, default: 2, min: 1, max: 5, description: Years of historical data (1-5)}

  - id: crypto_beta
    name: Crypto-Equity Beta
    description: Detect crypto-equity correlation regime (RISK_ON/RISK_OFF/NEUTRAL).
    category: alternatives
    executor: api.routers.canvas.tool_workflow.tools.alternatives.crypto_beta.execute_crypto_beta
    params_schema:
      crypto_symbol: {type: string, default: BTCUSD, enum: [BTCUSD, ETHUSD, SOLUSD, XRPUSD, ADAUSD, DOGEUSD, AVAXUSD, MATICUSD, DOTUSD, LINKUSD], description: Primary cryptocurrency}
      equity_symbol: {type: string, default: SPY, enum: [SPY, QQQ, IWM, DIA, VTI, XLK, XLF, XLE, ARKK, TLT], description: Primary equity benchmark}
      additional_cryptos:
        type: array
        items: string
        default: []
        enum: [BTCUSD, ETHUSD, SOLUSD, XRPUSD, ADAUSD, DOGEUSD, AVAXUSD, MATICUSD, DOTUSD, LINKUSD]
        description: Additional cryptos for correlation matrix
      additional_equities:
        type: array
        items: string
        default: []
        enum: [SPY, QQQ, IWM, DIA, VTI, XLK, XLF, XLE, ARKK, TLT]
        description: Additional equities for correlation matrix
      lookback_days: {type: number, default: 365, min: 60, max: 756, description: Historical lookback (days)}
      high_z_threshold: {type: number, default: 1.5, min: 1.0, max: 3.0, description: Z-score for RISK_ON signal}
      low_z_threshold: {type: number, default: -1.5, min: -3.0, max: -1.0, description: Z-score for RISK_OFF signal}

  - id: fx_carry
