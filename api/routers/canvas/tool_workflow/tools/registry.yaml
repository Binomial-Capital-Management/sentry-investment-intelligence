    params_schema:
      derivative_type: {type: string, required: true, enum: [barrier, asian, lookback, digital], default: barrier, description: Exotic option type}
      underlying: {type: string, required: true, description: "Stock ticker (e.g., SPY, AAPL, NVDA)"}
      option_type: {type: string, default: call, enum: [call, put], description: Call or Put}
      strike: {type: number, required: false, description: Strike price in $ (leave empty for ATM = current spot)}
      expiry: {type: string, required: false, description: "Expiry date YYYY-MM-DD (default: 3 months out)"}
      num_simulations: {type: number, default: 5000, min: 1000, max: 50000, description: Monte Carlo paths}
      barrier_type: {type: string, enum: [up-and-out, up-and-in, down-and-out, down-and-in], default: up-and-out, description: Barrier option type}
      barrier_level: {type: number, required: false, description: Barrier price level in $}
      averaging_type: {type: string, enum: [arithmetic, geometric], default: arithmetic, description: Asian averaging type}
      averaging_frequency: {type: string, enum: [daily, weekly, monthly], default: daily, description: Asian sampling frequency}
      lookback_type: {type: string, enum: [fixed, floating], default: fixed, description: Lookback strike type}
      digital_payoff: {type: number, default: 100, description: Digital option fixed payout amount in $}

  - id: swaption
    name: Swaption Pricing
    description: Price interest rate swaptions (options on swaps) using Black or Bachelier models.
    category: structuring
    executor: api.routers.canvas.tool_workflow.tools.structuring.swaption.execute_swaption
    params_schema:
      notional: {type: number, default: 10000000, min: 100000, max: 1000000000, description: Notional amount in $}
      tenor: {type: string, default: "5Y", enum: ["2Y", "5Y", "7Y", "10Y", "15Y", "20Y", "30Y"], description: Swap maturity}
      float_index: {type: string, default: SOFR, enum: [SOFR, EFFR, FEDFUNDS], description: Floating rate index}
      payment_freq: {type: string, default: semiannual, enum: [quarterly, semiannual, annual], description: Payment frequency}
      option_type: {type: string, required: true, enum: [payer, receiver], description: Payer (bet rates rise) or Receiver (bet rates fall)}
      expiry: {type: string, required: false, description: "Option expiry date (YYYY-MM-DD). Default: 3 months from now."}
      strike: {type: number, default: 0.045, min: 0.001, max: 0.20, description: "Strike rate (decimal). E.g., 0.045 = 4.5%"}
      pricing_model: {type: string, default: black, enum: [black, bachelier], description: Pricing model}
      volatility: {type: number, required: false, description: Override volatility (decimal). Leave empty to auto-estimate.}
      pricing_date: {type: string, required: false, description: "Valuation date (YYYY-MM-DD). Default: today."}

  - id: irs
    name: Interest Rate Swap (IRS)
    description: Price vanilla interest rate swaps using FRED treasury data.
    category: structuring
    executor: api.routers.canvas.tool_workflow.tools.structuring.irs.execute_irs
    params_schema:
      notional: {type: number, default: 10000000, min: 100000, max: 1000000000, description: Notional amount in $}
      fixed_rate: {type: number, default: 0.04, min: 0.001, max: 0.20, description: "Fixed rate (decimal, e.g., 0.045 = 4.5%)"}
      float_index: {type: string, default: SOFR, enum: [SOFR, EFFR, FEDFUNDS], description: Floating rate index}
      tenor: {type: string, default: "5Y", enum: ["2Y", "5Y", "7Y", "10Y", "15Y", "20Y", "30Y"], description: Swap maturity}
      payment_freq: {type: string, default: semiannual, enum: [quarterly, semiannual, annual], description: Payment frequency}
      pricing_date: {type: string, required: false, description: "Valuation date (YYYY-MM-DD). Default: today."}

  - id: cds
    name: Credit Default Swap (CDS)
    description: Calculate fair CDS spread using Merton model.
    category: structuring
    executor: api.routers.canvas.tool_workflow.tools.structuring.cds.execute_cds
    params_schema:
      ticker: {type: string, required: true, description: "Reference entity ticker (e.g., AAPL, TSLA)"}
      notional: {type: number, default: 10000000, min: 100000, max: 1000000000, description: Notional amount in $}
      tenor: {type: string, default: "5Y", enum: ["1Y", "3Y", "5Y", "7Y", "10Y"], description: CDS maturity}
      pricing_date: {type: string, required: false, description: "Valuation date (YYYY-MM-DD). Default: today."}

  # =============================================================================
  # ALTERNATIVES TOOLS
  # =============================================================================
  - id: commodity_ratio
    name: Commodity Ratio
    description: "Analyze any commodity ratio for mean reversion. Presets: Gold/Silver, Gold/Oil, etc."
    category: alternatives
    executor: api.routers.canvas.tool_workflow.tools.alternatives.commodity_ratio.execute_commodity_ratio
    params_schema:
      preset: {type: string, default: gold_silver, enum: [gold_silver, gold_oil, oil_gas, copper_gold, silver_copper, custom], description: "Preset pair or 'custom' for manual symbols"}
      numerator: {type: string, required: false, description: "Numerator symbol (for custom, e.g. GCUSD)"}
      denominator: {type: string, required: false, description: "Denominator symbol (for custom, e.g. SIUSD)"}
      lookback_days: {type: number, default: 365, min: 60, max: 756, description: Historical lookback (days)}
      high_z_threshold: {type: number, default: 1.5, min: 1.0, max: 3.0, description: Z-score for DENOM_CHEAP signal}
      low_z_threshold: {type: number, default: -1.5, min: -3.0, max: -1.0, description: Z-score for NUM_CHEAP signal}

  - id: commodity_momentum
    name: Commodity Momentum
