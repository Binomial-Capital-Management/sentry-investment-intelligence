    executor: api.routers.canvas.tool_workflow.tools.structuring.var_swap.execute_var_swap
    params_schema:
      underlying: {type: string, required: true, description: "Stock ticker (e.g., SPY, AAPL)"}
      notional: {type: number, default: 100000, min: 1000, description: Notional per variance point ($)}
      strike_variance: {type: number, required: false, description: Strike variance (decimal). Leave empty for fair strike.}
